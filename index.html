<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Bio: Fenix</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Orbitron:wght@400;900&display=swap" rel="stylesheet"/>
<style>
body {
  margin:0;
  font-family:'Outfit',sans-serif;
  color:white;
  padding:40px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
  perspective:1000px;
  background:black;
  overflow-x: hidden;
}
.video-bg {
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
  z-index:-1;
}
.bio-wrapper {
  position: relative;
  transition:transform 0.15s ease;
  transform-style:preserve-3d;
  width:100%;
  max-width:720px;
  will-change: transform;
}
.card, .block {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border-radius: 24px;
  padding: 32px;
  width: 100%;
  box-sizing: border-box;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
  transition: all 0.3s ease;
  margin-bottom: 24px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.banner {width:100%;height:140px;border-radius:20px;background:url('banner.jpg') center/cover no-repeat;margin-bottom:-50px;}
.ghost-container {position:relative;width:104px;height:104px;margin:0 auto;}
.ghost-ring {position:absolute;top:-20px;left:-20px;width:144px;height:144px;background:url('https://r2.fakecrime.bio/assets/decorations/ghosts.gif') no-repeat center;background-size:contain;z-index:0;animation:ghost-ring 6s linear infinite;}
.avatar {width:104px;height:104px;border-radius:50%;background:url('avatarka.png') center/cover no-repeat;border:3px solid white;position:relative;z-index:1;}
.username {text-align:center;font-size:28px;font-weight:bold;margin-top:20px;color:white;text-shadow:0 0 6px rgba(255,255,255,0.9);}
.tag-buttons {display:flex;gap:12px;margin:20px auto;justify-content:center;flex-wrap:wrap;}
.tag-button {border:1px solid rgba(255,255,255,0.3);padding:6px 14px;border-radius:20px;font-size:11px;font-family:'Orbitron',sans-serif;color:white;text-transform:uppercase;font-weight:900;background:rgba(255,255,255,0.05);cursor:pointer;transition:all 0.3s ease;}
.tag-button:hover {background:rgba(255,255,255,0.15);border-color:white;transform:scale(1.15);}

.location {text-align:center; margin-top:16px; opacity: 1;}

.rainbow-text {
  font-weight: bold;
  background: linear-gradient(
    to right, 
    #ef5350, #f48fb1, #7e57c2, #2196f3, #26c6da, #43a047, #eeff41, #f9a825, #ff5722
  );
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
  animation: rainbow-animation 3s linear infinite;
}

.friends-container {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 25px;
}
.friends-group {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 18px;
  padding: 15px;
  text-align: center;
}
.friends-group-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 12px;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 1px;
}
.friends-list {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}
.friend-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  transition: transform 0.2s ease;
  cursor: pointer;
  text-decoration: none;
}
.friend-item:hover {
  transform: scale(1.1);
}
.friend-avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: 2px solid white;
  object-fit: cover;
  background: rgba(255, 255, 255, 0.2);
}
.friend-name {
  font-size: 10px;
  color: white;
  font-weight: 600;
  opacity: 0.8;
}

.link-box, .music-card {
  background:rgba(10,10,10,0.5) !important; 
  backdrop-filter:blur(10px);
  border-radius:24px;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
  transition:all 0.3s ease;
}

.discord-card {
  background: rgba(88, 101, 242, 0.15) !important;
  border: 1px solid rgba(88, 101, 242, 0.4) !important;
  text-align: center;
  padding: 24px !important;
  text-decoration: none; 
  display: block;
  color: white;
  transition: all 0.3s ease !important;
  cursor: pointer;
}
.discord-card:hover {
  background: rgba(88, 101, 242, 0.25) !important;
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 0 30px rgba(88, 101, 242, 0.4) !important;
  border-color: rgba(88, 101, 242, 0.8) !important;
}
.discord-btn {
  display: inline-block;
  margin-top: 15px;
  background: #5865F2;
  color: white;
  padding: 10px 24px;
  border-radius: 14px;
  font-weight: 700;
  font-size: 14px;
  text-decoration: none;
  transition: 0.3s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.discord-btn:hover {
  background: #4752C4;
  transform: scale(1.05);
}

@keyframes ghost-ring{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes rainbow-animation {
  0% { background-position: 0% center; }
  100% { background-position: 200% center; }
}

.services-section {
  width: 100%;
  max-width: 720px;
  margin-top: 8px;
  padding-bottom: 48px;
}
.services-wrapper {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.section-header {
  text-align: center;
  margin-bottom: 4px;
}
.section-title {
  font-size: 22px;
  font-weight: 700;
  margin: 0 0 8px;
  letter-spacing: 0.04em;
}
.section-subtitle {
  margin: 0;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.55);
  line-height: 1.5;
}
.services-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
@media (min-width: 560px) {
  .services-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .service-card--wide {
    grid-column: span 2;
  }
}
.service-card {
  position: relative;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 22px 20px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  overflow: hidden;
}
.service-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 20px;
  padding: 1px;
  background: linear-gradient(135deg, rgba(126, 87, 194, 0.5), rgba(33, 150, 243, 0.3), rgba(67, 160, 71, 0.2));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
.service-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5), 0 0 24px rgba(126, 87, 194, 0.15);
  border-color: rgba(255, 255, 255, 0.22);
}
.service-card:hover::before {
  opacity: 1;
}
.service-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  margin-bottom: 14px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.service-icon--minecraft { background: linear-gradient(135deg, rgba(67, 160, 71, 0.35), rgba(139, 195, 74, 0.2)); }
.service-icon--discord { background: linear-gradient(135deg, rgba(88, 101, 242, 0.4), rgba(114, 137, 218, 0.2)); }
.service-icon--web { background: linear-gradient(135deg, rgba(126, 87, 194, 0.4), rgba(33, 150, 243, 0.25)); }
.service-name {
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 8px;
  line-height: 1.35;
  color: rgba(255, 255, 255, 0.95);
}
.service-desc {
  font-size: 0.78rem;
  color: rgba(255, 255, 255, 0.5);
  margin: 0 0 14px;
  line-height: 1.45;
}
.service-price {
  display: inline-block;
  font-size: 0.82rem;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(126, 87, 194, 0.35), rgba(33, 150, 243, 0.25));
  border: 1px solid rgba(255, 255, 255, 0.15);
  letter-spacing: 0.02em;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
}
.skills-block {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border-radius: 24px;
  padding: 28px 24px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
  text-align: center;
}
.skills-title {
  margin-bottom: 18px;
}
.skills-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
.skill-badge {
  font-size: 0.8rem;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 14px;
  background: rgba(10, 10, 10, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: white;
  transition: all 0.25s ease;
  letter-spacing: 0.03em;
}
.skill-badge:hover {
  transform: scale(1.06);
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.35);
  box-shadow: 0 0 16px rgba(126, 87, 194, 0.3);
}
.skill-badge--java { border-color: rgba(244, 67, 54, 0.4); }
.skill-badge--cpp { border-color: rgba(33, 150, 243, 0.4); }
